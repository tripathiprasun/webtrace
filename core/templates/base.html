<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebTrace{% endblock %}</title>

    <!-- Favicon - SVG as data URI -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0a'/%3E%3Cpath d='M20 40h15v40H20zm22.5-15h15v55h-15zm22.5 25h15v30h-15z' fill='%2310b981'/%3E%3C/svg%3E">

    <!-- Cytoscape.js -->
    <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0a0a0a',
                            surface: '#141414',
                            border: '#282828',
                            hover: '#1a1a1a',
                        }
                    }
                }
            }
        }
    </script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/css/main.css' %}">
</head>
<body class="bg-dark-bg text-gray-100 min-h-screen font-mono">
    <div class="min-h-screen flex flex-col">
        <header class="border-b border-dark-border bg-dark-surface">
            <div class="container mx-auto px-4 py-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                        <a href="{% url 'core:index' %}" class="text-sm font-semibold tracking-wide hover:text-green-400 transition-colors">WEBTRACE</a>
                    </div>
                    <div class="text-xs text-gray-500">
                        BROWSER BEHAVIOR ANALYZER
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1">
            {% block content %}{% endblock %}
        </main>

        <footer class="border-t border-dark-border bg-dark-surface mt-auto">
            <div class="container mx-auto px-4 py-3">
                <div class="text-xs text-gray-600 text-center">
                    WebTrace / Chromium-based network analyzer
                </div>
            </div>
        </footer>
    </div>

    <script src="{% static 'core/js/main.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
